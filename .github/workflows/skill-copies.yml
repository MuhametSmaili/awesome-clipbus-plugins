name: Skill copies

on:
  push:
    paths:
      - .agents/**
      - .claude/skills/**
      - .codex/skills/**
      - .github/workflows/skill-copies.yml
  pull_request:
    paths:
      - .agents/**
      - .claude/skills/**
      - .codex/skills/**
      - .github/workflows/skill-copies.yml

permissions:
  contents: read

jobs:
  copies:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: node .agents/scripts/check-skills.mjs
